  # -----------------------------------------------------------------------------------
  # Can use -> "BLUE", "GREEN", "PINK", "PURPLE", "RED", "WHITE", "YELLOW"
  Color: "BLUE"
  # Can use -> "SOLID", "SEGMENTED_6", "SEGMENTED_10", "SEGMENTED_12", "SEGMENTED_20"
  Type: "SOLID"


  # The messages below support legacy & codes and MiniMessage, mix them however you like.
  #
  # Colors:      &a &b &c ... or <green> <red> <gold> ...
  # Formatting:  &l &o &n ... or <bold> <italic> <underlined> ...
  # Hex:         &#00FFD3 {#00FFD3} <#00FFD3>
  # Spigot hex:  &x&0&0&F&F&D&3
  # Gradient:    <gradient:#2C08BA:#028A97>text</gradient>
  # Rainbow:     <rainbow>text</rainbow>
  # Placeholders needs PlaceholderAPI
  #
  # MiniMessage docs: https://docs.advntr.dev/minimessage/format.html

  # Empty message = disable function
  BossBarMessage: "&b&lYou are invisible"
  Screen:
    Vanished:
      TitleMessage: "&b&lInvisible"
      SubtitleMessage: ""
    UnVanished:
      TitleMessage: "&e&lVisible"
      SubtitleMessage: ""

    FadeIn: 0
    Stay: 20
    FadeOut: 7

  Reload:
    Reloading: "&c&l[!] &fThe &cBossBarVanish &faddon is &creloading&f!"
    Complete: "&a&l[!] &aBossBarVanish &freload is &acomplete&f!"
    Usage: "&b&lBBV &8● &fYou must use /bbv reload to reload plugin!"
    NoPermission: "&c&l[!] &fYou don´t have permission to use &c/bbv reload&f!"